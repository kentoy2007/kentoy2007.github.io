<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy 14th Monthsary!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            color: #ff66b2;
        }
        #message {
            margin-top: 30px;
            font-size: 20px;
            color: #d63384;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #ff99cc;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff66b2;
        }
    </style>
</head>
<body>

    <h1>Happy 14th Monthsary, My Baby!</h1>
    <button onclick="showMessage()">Click me, Love!</button>
    <div id="message"></div>

    <script>
        function showMessage() {
            const message = "Hello there, baby! Happy 14th Monthsary! I'm sorry that I get to forget what date it is today because I really planned on giving you a letter tomorrow because I thought that tomorrow ato monthsary,so that's why I made this nalang to relay my message for you, although bag-o pako kabuhat ingani kay I have no idea how to do this 😅, but I hope you'll like it. I want to thank you for always being there for me and for giving me your support all throughout our days that we've been together. I am so lucky to have you by my side. Here's to more years and memories together. I love you so much, my baby!";
            document.getElementById("message").textContent = message;
        }
    </script>

</body>
</html
